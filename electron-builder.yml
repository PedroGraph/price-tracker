appId: com.local.amazonpricetracker
productName: Amazon Price Tracker
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
# Runtime icons (window + tray); icon.ico for the .exe is picked up from buildResources.
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - tray.png
      - tray@2x.png
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: PedroGraph
  repo: price-tracker
