appId: com.local.amazonpricetracker
productName: Price Tracker
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
# Runtime icons (window + tray); icon.ico for the .exe is picked up from buildResources.
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - tray.png
      - tray@2x.png
win:
  target: nsis
  # No spaces: GitHub renames them in release assets, which confused updates.
  artifactName: Price-Tracker-Setup-${version}.${ext}
nsis:
  # One-click, per-user install (%LOCALAPPDATA%\Programs): no wizard and no admin prompt,
  # so updates can install silently and the app comes back by itself.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: Price Tracker
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: PedroGraph
  repo: price-tracker
  # Publish straight away: installed apps don't see draft releases.
  releaseType: release
# Security switches baked into the .exe (https://www.electronjs.org/docs/latest/tutorial/fuses)
electronFuses:
  runAsNode: false                           # the .exe can't be used as a plain Node.js runtime
  enableCookieEncryption: true               # Amazon session cookies encrypted on disk (DPAPI)
  enableNodeOptionsEnvironmentVariable: false # NODE_OPTIONS can't inject code
  enableNodeCliInspectArguments: false       # no --inspect debugger to read memory / cookies
  enableEmbeddedAsarIntegrityValidation: true # refuse to run a tampered app.asar
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
